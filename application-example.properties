# ==============================================
# REQUIRED ENVIRONMENT VARIABLES — CORRIDA DSC
# ==============================================
# Copy this file to application-local.properties and fill in your values.
# application-local.properties is git-ignored and must NEVER be committed.

# OpenRouteService API key
# Purpose: route calculation (distance, duration, GeoJSON) AND address geocoding
# Free tier: 2,000 req/day (directions), 3,000 req/day (geocoding)
# Obtain at: https://openrouteservice.org/dev/#/signup
ORS_API_KEY=your_key_here

ors.api-key=${ORS_API_KEY:}
ors.base-url=${ORS_BASE_URL:https://api.openrouteservice.org}

# MongoDB Connection URI (e.g. MongoDB Atlas cluster)
# Obtain at: https://www.mongodb.com/cloud/atlas
SPRING_DATA_MONGODB_URI=mongodb+srv://user:password@cluster.mongodb.net/audit_db?retryWrites=true&w=majority
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:}
