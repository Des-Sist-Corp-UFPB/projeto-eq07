name: CI/CD Pipeline - Build and Push to GHCR

# Trigger the workflow on every push to the main branch
on:
  push:
    branches:
      - main

# Define default environment variables
env:
  REGISTRY: ghcr.io
  # Definição global e centralizada do nome da imagem
  IMAGE_NAME: eq07

# Grant permissions required to publish packages to GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build, Test, and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java JDK environment
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Build the application with Maven (skipping tests)
      - name: Build with Maven
        run: |
          mvn clean package -B -DskipTests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eq07
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Extract metadata for the Backend Docker image (Incluindo o Owner do GitHub)
      - name: Extract Backend Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            latest

      # 7. Build and push the Backend Docker image
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. Extract metadata for the Frontend Docker image
      - name: Extract Frontend Docker metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            latest

      # 9. Build and push the Frontend Docker image
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || 'http://localhost:8080' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Remote Server
    runs-on: ubuntu-latest
    needs: build-and-publish

    steps:
      # SSH into the remote production server and execute deployment commands
      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ghcr.io
          # Monta a URI perfeitamente unificada usando o dono do repositório + seu padrão 'eq07'
          IMAGE_URI: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # CORRIGIDO: Agora o login não vem em branco
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: REGISTRY,IMAGE_URI,DB_USERNAME,DB_PASSWORD,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            BACKEND_URI="${IMAGE_URI}-backend:latest"
            FRONTEND_URI="${IMAGE_URI}-frontend:latest"

            echo "=== STARTING FULL DEPLOYMENT ==="

            # 1. Log in to GitHub Container Registry (GHCR) from remote server
            echo "Logging into GHCR..."
            echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

            # 2. Pull both latest Docker images
            echo "Pulling latest backend image: ${BACKEND_URI}..."
            docker pull "${BACKEND_URI}"

            echo "Pulling latest frontend image: ${FRONTEND_URI}..."
            docker pull "${FRONTEND_URI}"

            # 3. Stop and remove existing containers if they are running
            echo "Stopping and removing existing containers (eq07-app, eq07-frontend)..."
            docker stop eq07-app eq07-frontend || true
            docker rm eq07-app eq07-frontend || true

            # 4. Run the new backend container
            echo "Starting the new backend container (eq07-app)..."
            docker run -d \
              --name eq07-app \
              -p 8080:8080 \
              --restart unless-stopped \
              -e SPRING_DATASOURCE_URL="jdbc:postgresql://postgres:5432/eq07" \
              -e SPRING_DATASOURCE_USERNAME="$DB_USERNAME" \
              -e SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD" \
              -e SPRING_DATASOURCE_DRIVER_CLASS_NAME="org.postgresql.Driver" \
              "${BACKEND_URI}"

            # 5. Run the new frontend container (mapped to host port 80 for public access)
            echo "Starting the new frontend container (eq07-frontend)..."
            docker run -d \
              --name eq07-frontend \
              -p 80:80 \
              --restart unless-stopped \
              "${FRONTEND_URI}"

            # 6. Clean up unused/dangling Docker images to save disk space
            echo "Cleaning up dangling images..."
            docker image prune -f

            echo "=== FULL DEPLOYMENT COMPLETED SUCCESSFULLY ==="