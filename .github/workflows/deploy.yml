name: CI/CD Pipeline - Build and Push Monolith to GHCR

# Trigger the workflow on every push to the main branch
on:
  push:
    branches:
      - main

# Define default environment variables
env:
  REGISTRY: ghcr.io

# Grant permissions required to read contents
permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and Publish Monolith Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Lowercase the repository owner to construct a valid GHCR image path
      - name: Lowercase repository owner for GHCR compatibility
        id: repo_details
        run: |
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 3. Set up Docker Buildx for image building
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log in to GitHub Container Registry (GHCR) using Personal Access Token (PAT)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_DEPLOY_TOKEN }}

      # 5. Extract metadata (tags, labels) for the Monolith Docker image
      - name: Extract Monolith Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo_details.outputs.owner }}/eq07-monolith
          tags: |
            type=ref,event=branch
            type=sha,format=short
            latest

      # 6. Build and push the Monolith Docker image
      - name: Build and Push Monolith Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Remote Server
    runs-on: ubuntu-latest
    needs: build-and-publish # Run deployment after successful build & push

    steps:
      # 1. Lowercase the repository owner for GHCR compatibility on remote
      - name: Lowercase repository owner for GHCR compatibility
        id: repo_details
        run: |
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 2. SSH into the remote production server and execute monolith deployment
      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ steps.repo_details.outputs.owner }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: REGISTRY,OWNER,GHCR_DEPLOY_TOKEN,GITHUB_ACTOR
          script: |
            IMAGE_URI="${REGISTRY}/${OWNER}/eq07-monolith:latest"

            echo "=== STARTING MONOLITH DEPLOYMENT ==="

            # Log in to GitHub Container Registry (GHCR) from remote server using PAT
            echo "Logging into GHCR..."
            echo "$GHCR_DEPLOY_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

            # Pull the latest Monolith image
            echo "Pulling latest monolith image: ${IMAGE_URI}..."
            docker pull "${IMAGE_URI}"

            # Stop and remove existing containers if they exist
            echo "Stopping and removing existing containers (eq07-app, eq07-frontend, eq07-monolith)..."
            docker stop eq07-app eq07-frontend eq07-monolith || true
            docker rm eq07-app eq07-frontend eq07-monolith || true

            # Run the new consolidated monolith container
            echo "Starting the new monolith container (eq07-monolith)..."
            docker run -d \
              --name eq07-monolith \
              -p 8107:8080 \
              --restart unless-stopped \
              -e SPRING_DATASOURCE_URL="jdbc:postgresql://postgres:5432/eq07" \
              -e SPRING_DATASOURCE_USERNAME="eq07" \
              -e SPRING_DATASOURCE_PASSWORD="kEKJIJDg5YLhYdeDYFjg" \
              -e SPRING_DATASOURCE_DRIVER_CLASS_NAME="org.postgresql.Driver" \
              "${IMAGE_URI}"

            # Clean up unused/dangling Docker images to save disk space
            echo "Cleaning up dangling images..."
            docker image prune -f

            echo "=== MONOLITH DEPLOYMENT COMPLETED SUCCESSFULLY ==="
