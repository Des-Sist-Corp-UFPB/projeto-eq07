name: CI/CD Pipeline - Build and Push to GHCR

# Trigger the workflow on every push to the main branch
on:
  push:
    branches:
      - main

# Define default environment variables
env:
  REGISTRY: ghcr.io
  # Image name based on GitHub Repository (e.g., owner/repository-name)
  # GHCR requires package names to be lowercase, which is handled dynamically in the login/push steps
  IMAGE_NAME: ${{ github.repository }}

# Grant permissions required to publish packages to GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build, Test, and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java JDK environment
      # Note: We use Java 21 because the project's pom.xml specifies <java.version>21</java.version>.
      # To use Java 17, change '21' to '17' below (ensuring pom.xml is also aligned).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Automatically caches Maven dependencies to speed up subsequent runs

      # 3. Build the application with Maven (skipping unit/integration tests)
      # We inject the required database environment variables to ensure Spring configurations can parse.
      # Sensitive credentials are secure, coming from GitHub Secrets.
      - name: Build with Maven
        run: |
          mvn clean package -B -DskipTests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eq07
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver


      # 4. Set up Docker Buildx (enables advanced features like caching and multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Log in to GitHub Container Registry (GHCR)
      # Uses the automatic GITHUB_TOKEN for secure, zero-config authentication.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Extract metadata (tags, labels) for the Backend Docker image
      # Generates tags like 'latest', branch name, and git commit SHA.
      - name: Extract Backend Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            latest

      # 7. Build and push the Backend Docker image
      # Uses GHA local cache for extremely fast builds.
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. Extract metadata (tags, labels) for the Frontend Docker image
      - name: Extract Frontend Docker metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            latest

      # 9. Build and push the Frontend Docker image
      # Passes the VITE_API_BASE_URL as a build argument so the static bundle compiles with the correct backend URL.
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || 'http://localhost:8080' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Remote Server
    runs-on: ubuntu-latest
    needs: build-and-publish # Ensures deployment only runs after successful build & push

    steps:
      # 1. Lowercase the repository name on the GHA runner to avoid remote shell compatibility bugs
      - name: Lowercase repository name for GHCR compatibility
        id: repo_name
        run: |
          echo "lc_image=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 2. SSH into the remote production server and execute deployment commands for both backend and frontend
      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ steps.repo_name.outputs.lc_image }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: REGISTRY,IMAGE_NAME,DB_USERNAME,DB_PASSWORD,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            # Força a conversão do nome da imagem para minúsculas dentro do servidor
            LC_IMAGE=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
            BACKEND_URI="${REGISTRY}/${LC_IMAGE}-backend:latest"
            FRONTEND_URI="${REGISTRY}/${LC_IMAGE}-frontend:latest"

            echo "=== STARTING FULL DEPLOYMENT ==="

            # 2. Log in to GitHub Container Registry (GHCR) from remote server
            echo "Logging into GHCR..."
            echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

            # 3. Pull both latest Docker images
            echo "Pulling latest backend image: ${BACKEND_URI}..."
            docker pull "${BACKEND_URI}"

            echo "Pulling latest frontend image: ${FRONTEND_URI}..."
            docker pull "${FRONTEND_URI}"

            # 4. Stop and remove existing containers if they are running
            echo "Stopping and removing existing containers (eq07-app, eq07-frontend)..."
            docker stop eq07-app eq07-frontend || true
            docker rm eq07-app eq07-frontend || true

            # 5. Run the new backend container
            echo "Starting the new backend container (eq07-app)..."
            docker run -d \
              --name eq07-app \
              -p 8080:8080 \
              --restart unless-stopped \
              -e SPRING_DATASOURCE_URL="jdbc:postgresql://postgres:5432/eq07" \
              -e SPRING_DATASOURCE_USERNAME="$DB_USERNAME" \
              -e SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD" \
              -e SPRING_DATASOURCE_DRIVER_CLASS_NAME="org.postgresql.Driver" \
              "${BACKEND_URI}"

            # 6. Run the new frontend container (mapped to host port 80 for public access)
            echo "Starting the new frontend container (eq07-frontend)..."
            docker run -d \
              --name eq07-frontend \
              -p 80:80 \
              --restart unless-stopped \
              "${FRONTEND_URI}"

            # 7. Clean up unused/dangling Docker images to save disk space
            echo "Cleaning up dangling images..."
            docker image prune -f

            echo "=== FULL DEPLOYMENT COMPLETED SUCCESSFULLY ==="


