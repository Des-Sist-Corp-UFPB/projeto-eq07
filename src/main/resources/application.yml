server:
  port: 8080
spring:
  datasource:
    # Se DATABASE_URL for injetada pelo Docker, o Spring usa. Senão, adota o padrão local 'corridas_dev'
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/corridas_dev}
    username: ${DB_USERNAME:corridasdb}
    password: ${DB_PASSWORD:C@rR!d@db}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/audit_db}

api:
  security:
    token:
      # Permite injetar um secret forte em produção. Se não houver, usa o padrão.
      secret: ${API_SECURITY_TOKEN_SECRET:teste_secret}

ors:
  api-key: ${ORS_API_KEY:""}
  base-url: ${ORS_BASE_URL:https://api.openrouteservice.org}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    br.ufpb.dsc.corrida: INFO
    org.springframework.web: INFO
    # Logger dedicado para auditoria de elegibilidade — saída deve ter acesso restrito em produção
    ELIGIBILITY_AUDIT: INFO

litellm:
  base-url: ${LITELLM_BASE_URL:https://llm.rodrigor.com}
  api-key: ${LITELLM_API_KEY:sk-ivdkbnUwyFCPx5Cinwj_UBVz4ijT_S_YEqgZvWesymE}
  model: ${LITELLM_MODEL:gpt-4o}
  temperature: ${LITELLM_TEMPERATURE:0.1}
  timeout-ms: ${LITELLM_TIMEOUT_MS:10000}
  cache-ttl-seconds: ${ELIGIBILITY_CACHE_TTL_SECONDS:86400}
