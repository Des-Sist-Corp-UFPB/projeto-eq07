# =============================================================================
# Docker Compose — PRODUÇÃO (Equipe 07)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Banco de dados PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: eq07-postgres-prod
    environment:
      POSTGRES_DB: corridas_dev # Nome real do banco do projeto
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - eq07-prod-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      # Ajustado para checar o banco eq07
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d corridas_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - eq07-net

  # ---------------------------------------------------------------------------
  # Aplicação Spring Boot
  # ---------------------------------------------------------------------------
  app:
    image: ${APP_IMAGE}
    container_name: eq07-app-prod
    environment:
      # Ajustado para apontar para o banco eq07
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/corridas_dev}
      DATABASE_USERNAME: ${DB_USERNAME}
      DATABASE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8107:8080" # Perfeito! Redirecionamento da disciplina mantido
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Ajustado para usar o seu endpoint /ping seguro
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - eq07-net

volumes:
  eq07-prod-data:

networks:
  eq07-net:
    driver: bridge