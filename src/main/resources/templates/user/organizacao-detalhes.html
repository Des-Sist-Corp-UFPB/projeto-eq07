<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Umami Analytics -->
    <script defer src="https://umami.dsc.rodrigor.com/script.js" data-website-id="40e1c211-f336-42a8-b97c-01068e72a148"></script>

    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${organizacao.name + ' — Organização'}">Organização — Corrida DSC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: {
                            400: '#fb923c', 500: '#f97316',
                            600: '#ea580c', 700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glow-orange { box-shadow: 0 0 22px rgba(249,115,22,0.45); }
        .glow-card   { box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 0 40px rgba(249,115,22,0.04); }
        .nav-link { @apply flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/70 transition-all text-sm font-medium; }
        .nav-link.active { @apply bg-brand-600/20 text-brand-400 border border-brand-600/30; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans overflow-x-hidden">

    <!-- LEFT SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar('inicio')}"></div>

    <!-- MAIN CONTENT -->
    <main class="md:ml-[260px] min-h-screen pb-24 md:pb-0">

        <!-- Mobile top bar -->
        <div class="md:hidden flex items-center justify-between px-5 pt-5 pb-3">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-600 to-orange-400 flex items-center justify-center glow-orange">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" class="w-5 h-5 text-white">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 0 1-.982-3.172M9.497 14.25a7.454 7.454 0 0 0 .981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 0 0 7.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 0 0 2.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 0 1 2.916.52 6.003 6.003 0 0 1-5.395 4.972m0 0a6.726 6.726 0 0 1-2.749 1.35m0 0a6.772 6.772 0 0 1-3.044 0" />
                    </svg>
                </div>
                <span class="text-sm font-extrabold tracking-tight text-white">CORRIDA <span class="text-brand-500">DSC</span></span>
            </div>
            <a href="/minha-conta">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-brand-600 to-orange-400 flex items-center justify-center text-white text-xs font-bold glow-orange" th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 2))}">AT</div>
            </a>
        </div>

        <!-- Decorative Top Banner -->
        <div class="h-32 md:h-44 w-full bg-gradient-to-r from-brand-600/10 to-orange-400/10 relative overflow-hidden">
            <div class="absolute inset-0 bg-slate-950/40 backdrop-blur-sm"></div>
        </div>

        <div class="px-5 md:px-8 max-w-4xl mx-auto -mt-16 md:-mt-20 relative z-10 space-y-6">

            <!-- Organization Card -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 md:p-8 glow-card backdrop-blur-xl">
                <div class="flex flex-col md:flex-row gap-6 items-start justify-between">
                    <div class="flex flex-col sm:flex-row gap-5 items-center sm:items-start text-center sm:text-left">
                        <!-- Organization Logo or Default Shield -->
                        <div class="relative">
                            <div th:if="${#strings.isEmpty(organizacao.logoUrl)}"
                                 class="w-24 h-24 rounded-2xl bg-gradient-to-tr from-brand-600 to-orange-400 flex items-center justify-center text-white text-3xl font-extrabold shadow-xl border-4 border-slate-900 glow-orange"
                                 th:text="${#strings.toUpperCase(#strings.substring(organizacao.name, 0, 2))}">
                                SC
                            </div>
                            <img th:if="${not #strings.isEmpty(organizacao.logoUrl)}"
                                 th:src="${organizacao.logoUrl}"
                                 class="w-24 h-24 rounded-2xl object-cover border-4 border-slate-900 shadow-xl" alt="Logo da Organização" />
                        </div>

                        <!-- Organization Names & Location -->
                        <div class="space-y-2">
                            <h1 class="text-2xl md:text-3xl font-extrabold text-white leading-tight" th:text="${organizacao.name}">Super Corridas</h1>
                            <p class="text-slate-400 text-sm font-medium flex items-center gap-1 justify-center sm:justify-start">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-brand-500">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
                                </svg>
                                <span th:text="${organizacao.city + ' - ' + organizacao.state}">Cidade - UF</span>
                            </p>
                            <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-[11px] font-semibold bg-brand-500/10 text-brand-400 border border-brand-500/20">
                                Fundada em <span th:text="${#temporals.format(organizacao.foundedAt, 'dd/MM/yyyy')}">01/01/2020</span>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Description Section -->
                <div class="mt-8 border-t border-slate-800/80 pt-6">
                    <h3 class="text-slate-300 font-bold uppercase tracking-wider text-xs mb-3">Sobre a Organização</h3>
                    <p class="text-slate-400 text-sm leading-relaxed" th:text="${organizacao.description}">
                        Nenhuma descrição fornecida para esta organização.
                    </p>
                </div>

                <!-- Organizer Contact Reference -->
                <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-950/40 p-4 border border-slate-800/50 rounded-2xl">
                    <div>
                        <h4 class="text-[11px] text-slate-500 font-bold uppercase tracking-wider">Diretor Responsável</h4>
                        <p class="text-slate-200 text-sm font-semibold" th:text="${organizacao.organizer.usuario.nome}">Nome do Diretor</p>
                        <p class="text-slate-500 text-xs mt-0.5" th:text="'CREF ' + ${organizacao.organizer.cref}">CREF</p>
                    </div>
                    <div>
                        <h4 class="text-[11px] text-slate-500 font-bold uppercase tracking-wider">Canais de Contato</h4>
                        <p class="text-slate-300 text-sm flex items-center gap-1.5 mt-0.5">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-emerald-500">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 0 1-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8Z" />
                            </svg>
                            <span th:text="${organizacao.organizer.whatsapp}">Whatsapp</span>
                        </p>
                        <p th:if="${not #strings.isEmpty(organizacao.socialLink)}" class="text-brand-400 text-xs mt-1 truncate">
                            <a th:href="${organizacao.socialLink}" target="_blank" class="hover:underline" th:text="${organizacao.socialLink}">Rede Social</a>
                        </p>
                    </div>
                </div>

            </div>

        </div>
    </main>
</body>
</html>
