name: Integração contínua

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: corridas_dev
          POSTGRES_USER: corridasdb
          POSTGRES_PASSWORD: C@rR!d@db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U corridasdb -d corridas_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Instalar dependências e rodar testes
        run: mvn dependency:resolve

      - name: Teste de qualidade de código (lint)
        run: mvn pmd:check   

      - name: Rodar testes
        run: mvn verify
  
  load-test:
    name: Teste de carga
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: corridas_dev
          POSTGRES_USER: corridasdb
          POSTGRES_PASSWORD: C@rR!d@db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U corridasdb -d corridas_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Configura JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build da aplicação Spring Boot
        run: mvn clean package -DskipTests

      - name: Iniciar Spring Boot em Background
        run: |
          java -jar target/*.jar > spring-boot.log 2>&1 &
          echo "Spring Boot iniciando..."

      - name: Aguardar o Spring Boot ficar online (Health Check)
        run: |
          timeout 60s bash -c '
          until curl -s http://localhost:8080/login > /dev/null; do
            echo "Aguardando endpoint /login..."
            sleep 3
          done'
          echo "Spring Boot pronto para receber carga!"

      - name: Capturar logs iniciais em caso de falha no boot
        if: failure() 
        run: cat spring-boot.log

      - name: Executar Teste de Carga com Gatling
        run: mvn gatling:test

      - name: Upload dos Relatórios do Gatling (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-gatling
          path: target/gatling/*/
          retention-days: 7