<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Atletas — Corrida DSC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon" th:href="@{/corrida.ico}">
    <meta name="theme-color" content="#212529">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: {
                            400: '#fb923c', 500: '#f97316',
                            600: '#ea580c', 700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        .glow-orange   { box-shadow: 0 0 22px rgba(249,115,22,0.45); }
        .glow-card     { box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 0 40px rgba(249,115,22,0.04); }
        .nav-link { @apply flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/70 transition-all text-sm font-medium; }
        .nav-link.active { @apply bg-brand-600/20 text-brand-400 border border-brand-600/30; }
        .bnav-link { @apply flex items-center gap-0.5 text-slate-500 hover:text-brand-400 transition-colors text-[10px] font-semibold; }
        .bnav-link.active { @apply text-brand-400; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans overflow-x-hidden">

<div th:replace="~{fragments/sidebar :: sidebar('atletas')}"></div>

<main class="md:ml-[260px] min-h-screen pb-24 md:pb-0">
    <!-- ── MOBILE TOP BAR ── -->
    <div class="md:hidden flex items-center justify-between px-5 pt-5 pb-3">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-600 to-orange-400 flex items-center justify-center glow-orange">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" class="w-5 h-5 text-white">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 0 1-.982-3.172M9.497 14.25a7.454 7.454 0 0 0 .981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 0 0 7.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 0 0 2.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 0 1 2.916.52 6.003 6.003 0 0 1-5.395 4.972m0 0a6.726 6.726 0 0 1-2.749 1.35m0 0a6.772 6.772 0 0 1-3.044 0"/>
                </svg>
            </div>
            <span class="text-sm font-extrabold tracking-tight text-white">CORRIDA <span class="text-brand-500">DSC</span></span>
        </div>
        <div sec:authorize="isAuthenticated()">
            <img th:if="${userProfilePhotoUrl != null and !userProfilePhotoUrl.isEmpty()}" 
                 th:src="${userProfilePhotoUrl}" 
                 alt="Foto de perfil"
                 class="w-8 h-8 rounded-full object-cover">
            <div th:unless="${userProfilePhotoUrl != null and !userProfilePhotoUrl.isEmpty()}"
                 class="w-8 h-8 rounded-full bg-gradient-to-tr from-brand-600 to-orange-400 flex items-center justify-center text-white text-xs font-bold"
                 th:text="${#strings.isEmpty(#authentication.principal.nome) ? '?' : #strings.toUpperCase(#strings.substring(#authentication.principal.nome, 0, 1))}">AT</div>
        </div>
    </div>

    <!-- ── HEADER HERO ── -->
    <div class="px-5 md:px-12 pt-8 md:pt-14 pb-8">
        <h1 class="text-3xl md:text-5xl font-black text-white tracking-tight leading-tight">
            Explorar <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-brand-600">Atletas</span>
        </h1>
        <p class="text-slate-400 mt-3 md:text-lg max-w-2xl">Encontre outros corredores, faça novas conexões e expanda sua rede.</p>
        
        <!-- Search form -->
        <form action="/atletas" method="get" class="mt-8 flex gap-3 max-w-xl">
            <div class="relative flex-1">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-slate-500">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>
                </div>
                <input type="text" name="query" th:value="${query}" placeholder="Pesquisar por nome..." 
                       class="w-full pl-11 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-colors">
            </div>
            <button type="submit" class="px-6 py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl transition-colors glow-btn">
                Buscar
            </button>
        </form>
    </div>

    <!-- ── GRID DE ATLETAS ── -->
    <div class="px-5 md:px-12 pb-16">
        <div th:if="${#lists.isEmpty(atletas)}" class="text-center py-16 text-slate-500 bg-slate-900/40 rounded-2xl border border-slate-800 border-dashed">
            Nenhum atleta encontrado com esse nome.
        </div>
        
        <div th:unless="${#lists.isEmpty(atletas)}" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
            <div th:each="usuario : ${atletas}"
                 class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 glow-card hover:border-brand-600/40 transition-all text-center group flex flex-col justify-between">
                
                <div>
                    <div>
                        <img th:if="${usuario.fotoPerfil != null}" 
                             th:src="${usuario.fotoPerfil}" 
                             alt="Foto de perfil"
                             class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover mx-auto mb-4 glow-orange group-hover:scale-105 transition-transform border-2 border-slate-800 group-hover:border-brand-500/50">
                        <div th:unless="${usuario.fotoPerfil != null}"
                             class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-gradient-to-tr from-brand-600 to-orange-400 flex items-center justify-center text-white text-xl font-extrabold mx-auto mb-4 glow-orange group-hover:scale-105 transition-transform border-2 border-slate-800 group-hover:border-brand-500/50"
                             th:text="${#strings.isEmpty(usuario.nome) ? '?' : #strings.toUpperCase(#strings.substring(usuario.nome, 0, 1))}">
                            ??
                        </div>
                    </div>

                    <p class="font-bold text-white leading-tight truncate" th:text="${usuario.nome}">Nome</p>
                    <p class="text-xs text-slate-500 mt-1 mb-4 truncate" th:text="'@' + ${usuario.username}">@username</p>
                </div>
                
                <a th:href="@{'/user/' + ${usuario.username} + '/profile'}" 
                   class="block w-full py-2 bg-slate-800 hover:bg-brand-600 text-white text-xs font-bold rounded-lg transition-colors mt-auto">
                    Ver Perfil
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/sidebar :: bottomNav('atletas')}"></div>

</body>
</html>
