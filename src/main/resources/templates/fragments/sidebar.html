<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- ════════════════════════════════════════════════
     LEFT SIDEBAR FRAGMENT
     Usage: <div th:replace="~{fragments/sidebar :: sidebar('inicio')}"></div>
════════════════════════════════════════════════ -->


<aside th:fragment="sidebar(activePage)" class="hidden md:flex flex-col fixed left-0 top-0 h-screen w-[260px] bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 z-40">
    <style type="text/tailwindcss">
        /* Glow helpers */
        .glow-orange   { box-shadow: 0 0 22px rgba(249,115,22,0.45); }
        .glow-card     { box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 0 40px rgba(249,115,22,0.04); }
        .glow-btn      { box-shadow: 0 0 14px rgba(249,115,22,0.35); }

        /* Carousel fade transitions */
        .slide { transition: opacity 0.6s ease, transform 0.6s ease; }
        .slide-hidden { opacity: 0; pointer-events: none; position: absolute; inset: 0; }
        .slide-visible { opacity: 1; pointer-events: auto; position: relative; }

        /* Horizontal scroll for athlete row */
        .scroll-row { scrollbar-width: thin; scrollbar-color: #334155 transparent; }
        .scroll-row::-webkit-scrollbar { height: 4px; }
        .scroll-row::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        /* Sidebar active link */
        .nav-link { @apply flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/70 transition-all text-sm font-medium; }
        .nav-link.active { @apply bg-brand-600/20 text-brand-400 border border-brand-600/30; }

        /* Bottom nav active */
        .bnav-link { @apply flex items-center gap-0.5 text-slate-500 hover:text-brand-400 transition-colors text-[10px] font-semibold; }
        .bnav-link.active { @apply text-brand-400; }
    </style>

    <!-- Brand -->
    <div class="px-6 pt-7 pb-6 border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-orange-400 flex items-center justify-center glow-orange flex-shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" class="w-6 h-6 text-white">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 0 1-.982-3.172M9.497 14.25a7.454 7.454 0 0 0 .981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 0 0 7.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 0 0 2.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 0 1 2.916.52 6.003 6.003 0 0 1-5.395 4.972m0 0a6.726 6.726 0 0 1-2.749 1.35m0 0a6.772 6.772 0 0 1-3.044 0"/>
                </svg>
            </div>
            <div>
                <p class="text-base font-extrabold tracking-tight text-white leading-none">CORRIDA</p>
                <p class="text-xs text-brand-500 font-bold tracking-widest">DSC EQ07</p>
            </div>
        </div>
    </div>

    <!-- Nav Links -->
    <nav class="flex-1 px-3 py-5 space-y-1 overflow-y-auto">

        <a href="/" th:class="'nav-link ' + (${activePage == 'inicio'} ? 'active' : '')">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5 flex-shrink-0">
                <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/>
            </svg>
            Início
        </a>

        <a th:href="@{/corridas}" th:class="'nav-link ' + (${activePage == 'corridas'} ? 'active' : '')">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5 flex-shrink-0">
                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
            </svg>
            Procurar Corrida
        </a>

        <a sec:authorize="isAuthenticated()" th:href="@{/minhas-inscricoes}" th:class="'nav-link ' + (${activePage == 'minhas-inscricoes'} ? 'active' : '')">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5 flex-shrink-0">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 0 1 0 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 0 1 0-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375Z" />
            </svg>
            Minhas Inscrições
        </a>

        <a sec:authorize="hasRole('ORGANIZADOR')" th:if="${userOrganizationId != null}" th:href="@{|/organizacao/${userOrganizationId}/corridas|}" th:class="'nav-link ' + (${activePage == 'minhas-corridas'} ? 'active' : '')">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5 flex-shrink-0">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/>
            </svg>
            Minhas Corridas
        </a>

        <!-- Meu Perfil — replaced Minha Conta -->
        <a sec:authorize="isAuthenticated()" th:href="@{|/user/${#authentication.principal.userUsername}/profile|}" th:class="'nav-link ' + (${activePage == 'perfil'} ? 'active' : '')">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5 flex-shrink-0">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
            </svg>
            Meu perfil
        </a>

        <!-- Solicitações -->
        <a sec:authorize="isAuthenticated()" th:href="@{/solicitacoes}" th:class="'nav-link flex justify-between items-center ' + (${activePage == 'solicitacoes'} ? 'active' : '')">
            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5 flex-shrink-0">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z" />
                </svg>
                <span>Solicitações</span>
            </div>
            <span th:if="${pendingRequestsCount > 0}" th:text="${pendingRequestsCount}" class="bg-brand-500 text-white font-extrabold text-[10px] px-2 py-0.5 rounded-full glow-orange">3</span>
        </a>

        <!-- Login / Sign Up — only for anonymous (logged-out) users -->
        <a th:href="@{/login}" class="nav-link" sec:authorize="isAnonymous()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5 flex-shrink-0">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H2.25"/>
            </svg>
            Entrar / Cadastrar
        </a>
    </nav>

    <!-- Sidebar Footer: authenticated user card -->
    <div class="px-4 py-4 border-t border-slate-800" sec:authorize="isAuthenticated()">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-brand-600 to-orange-400 flex items-center justify-center text-white text-xs font-bold flex-shrink-0 glow-orange flex-shrink-0"
                 th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 2))}">AT</div>
            <div class="min-w-0">
                <p class="text-sm font-semibold text-slate-200 truncate" th:text="${#authentication.name}">Atleta</p>
                <p class="text-xs text-slate-500 truncate">
                    <span th:each="auth,i : ${#authentication.authorities}"
                          th:text="${auth.authority + (i.last ? '' : ', ')}"></span>
                </p>
            </div>
            <a th:href="@{/logout}" class="ml-auto text-slate-600 hover:text-red-400 transition-colors" title="Sair">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/>
                </svg>
            </a>
        </div>
    </div>

    <!-- Sidebar Footer: anonymous guest prompt -->
    <div class="px-4 py-4 border-t border-slate-800" sec:authorize="isAnonymous()">
        <a th:href="@{/registrar}"
           class="flex items-center justify-center gap-2 w-full py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-orange-500 hover:from-brand-500 hover:to-orange-400 text-white text-sm font-bold transition-all glow-btn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM4 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 10.374 21c-2.331 0-4.512-.645-6.374-1.766Z"/>
            </svg>
            Criar Conta Grátis
        </a>
        <p class="text-center text-xs text-slate-600 mt-2">
            Já tem conta?
            <a th:href="@{/login}" class="text-brand-400 hover:text-brand-300 font-semibold transition-colors">Entrar</a>
        </p>
    </div>
</aside>

</body>
</html>
