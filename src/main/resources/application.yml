server:
  port: 8080
spring:
  datasource:
    # Se DATABASE_URL for injetada pelo Docker, o Spring usa. Senão, adota o padrão local 'corridas_dev'
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/corridas_dev}
    username: ${DB_USERNAME:corridasdb}
    password: ${DB_PASSWORD:C@rR!d@db}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

api:
  security:
    token:
      # Permite injetar um secret forte em produção. Se não houver, usa o padrão.
      secret: ${API_SECURITY_TOKEN_SECRET:teste_secret}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    # Corrigido de 'mercado' para o pacote real do seu projeto 'corrida'
    br.ufpb.dsc.corrida: DEBUG
    org.springframework.web: DEBUG

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${AWS_S3_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${AWS_S3_REGION:us-east-1}
    bucket: ${AWS_S3_BUCKET:eq07}
    access-key: ${AWS_S3_ACCESS_KEY:eq07}
    secret-key: ${MINIO_SECRET:minioadmin}