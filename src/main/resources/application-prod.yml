spring:
  datasource:
    # Em produção, as credenciais vêm de variáveis de ambiente — NUNCA hardcode!
    # Configure no sistema operacional, Docker, Kubernetes secrets, etc.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never


logging:
  level:
    root: WARN
    br.ufpb.dsc.corrida: INFO

# Configuração MinIO/S3 de produção
# Apenas MINIO_SECRET vem de variável de ambiente (GitHub Actions secret)
aws:
  s3:
    endpoint: http://minio:9000
    public-endpoint: https://s3.dsc.rodrigor.com
    region: us-east-1
    bucket: eq07
    access-key: eq07
    secret-key: ${MINIO_SECRET}

