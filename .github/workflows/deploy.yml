name: CI/CD Pipeline - Build and Push to GHCR

# Trigger the workflow on every push to the main branch
on:
  push:
    branches:
      - main

# Define default environment variables
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Grant permissions required to publish packages to GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build, Test, and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java JDK environment
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Build the application with Maven (skipping unit/integration tests)
      # Removidas as variáveis de banco de dados não utilizadas devido ao -DskipTests
      - name: Build with Maven
        run: mvn clean package -B -DskipTests

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Extract metadata for the Backend Docker image
      - name: Extract Backend Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            latest

      # 7. Build and push the Backend Docker image
      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. Extract metadata for the Frontend Docker image
      - name: Extract Frontend Docker metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            latest

      # 9. Build and push the Frontend Docker image
      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || 'http://localhost:8080' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Remote Server
    runs-on: ubuntu-latest
    needs: build-and-publish

    steps:
      # 1. SSH into the remote production server and execute deployment
      # O checkout redundante foi removido daqui para acelerar a execução
      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_GHCR_USER: ${{ github.actor }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: dsc.rodrigor.com                  # Fixado direto no código para não precisar do SSH_HOST
          username: ${{ secrets.SSH_USERNAME }}   # Corrigido para mapear o seu secret real
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: PROD_GHCR_TOKEN,PROD_GHCR_USER,DB_USERNAME,DB_PASSWORD
          script: |
            echo "=== STARTING FULL DEPLOYMENT ==="

            # 1. Login no GHCR a partir do servidor remoto
            echo "Logging into GHCR..."
            echo "$PROD_GHCR_TOKEN" | docker login ghcr.io -u "$PROD_GHCR_USER" --password-stdin

            # 2. Acessa o diretório do projeto na VPS
            cd /app/eq07

            # 3. Exporta as variáveis para o docker compose ler
            export DB_USERNAME=$DB_USERNAME
            export DB_PASSWORD=$DB_PASSWORD

            # 4. Puxa as imagens mais recentes do GHCR
            docker compose -f docker/docker-compose.prod.yml pull

            # 5. Sobe os containers (recria apenas os que mudaram)
            docker compose -f docker/docker-compose.prod.yml up -d --remove-orphans

            # 6. Remove imagens antigas para liberar espaço
            docker image prune -f

            # 7. Confirmação de integridade dos containers em execução
            docker ps

            echo "=== FULL DEPLOYMENT COMPLETED SUCCESSFULLY ==="