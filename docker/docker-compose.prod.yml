# =============================================================================
# Docker Compose — PRODUÇÃO (Equipe 07)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Banco de dados PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: eq07-postgres-prod
    environment:
      POSTGRES_DB: eq07 # Nome real do banco do projeto
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - eq07-prod-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      # Ajustado para checar o banco eq07
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d eq07"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - eq07-net

  # ---------------------------------------------------------------------------
  # Aplicação Spring Boot
  # ---------------------------------------------------------------------------
  app:
    image: ${APP_IMAGE}
    container_name: eq07-app-prod
    pull_policy: always
    environment:
      # Ajustado para apontar para o banco eq07
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DB_USERNAME}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-dsc-eq07}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-https://otel.dsc.rodrigor.com}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
      MINIO_ENDPOINT_INTERNAL: ${MINIO_ENDPOINT_INTERNAL:-http://minio:9000}
      MINIO_ENDPOINT_PUBLIC: ${MINIO_ENDPOINT_PUBLIC:-https://s3.dsc.rodrigor.com}
      MINIO_BUCKET: ${MINIO_BUCKET:-eq07}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:8107:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - eq07-net

volumes:
  eq07-prod-data:

networks:
  eq07-net:
    driver: bridge