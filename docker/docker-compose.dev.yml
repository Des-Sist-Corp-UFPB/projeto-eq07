# =============================================================================
# Docker Compose — DESENVOLVIMENTO
# =============================================================================
# Sobe o ambiente completo de desenvolvimento com:
#   - app:      Aplicação Spring Boot com hot-reload
#   - postgres: Banco de dados PostgreSQL 16
#   - adminer:  Interface web para inspecionar o banco (http://localhost:8888)
#   - trivy:    Scanner de vulnerabilidades (roda uma vez e sai)
#
# Como usar:
#   docker compose -f docker/docker-compose.dev.yml up
#   docker compose -f docker/docker-compose.dev.yml up --build  # forçar rebuild
#
# Para rodar só o banco:
#   docker compose -f docker/docker-compose.dev.yml up postgres adminer
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Banco de dados PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: corridas-postgres-dev
    environment:
      POSTGRES_DB: corridas_dev
      POSTGRES_USER: corridasdb
      POSTGRES_PASSWORD: C@rR!d@db
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corridasdb -d corridas_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - corridas-net

  # ---------------------------------------------------------------------------
  # Banco de dados MongoDB (Auditoria)
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Aplicação Spring Boot (hot-reload)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: corridas-app-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/corridas_dev
      SPRING_DATASOURCE_USERNAME: corridasdb
      SPRING_DATASOURCE_PASSWORD: C@rR!d@db
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/auditoria_db
      MAVEN_OPTS: "-Xmx1536m"
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:dsc-eq07}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
    deploy:
      resources:
        limits:
          memory: 3072M
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      # Monta o código-fonte para hot-reload
      - ../src:/app/src
      # Persistir dependências Maven (evita re-download a cada restart)
      - maven-cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      otel-lgtm:
        condition: service_started
    networks:
      - corridas-net

  # ---------------------------------------------------------------------------
  # OpenTelemetry LGTM Stack (Loki, Grafana, Tempo, Mimir)
  # Acesse o Grafana em: http://localhost:3000
  # ---------------------------------------------------------------------------
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: otel-lgtm
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - corridas-net

  # ---------------------------------------------------------------------------
  # Adminer: interface web para o banco de dados
  # Acesse: http://localhost:8888
  # Servidor: postgres | Banco: mercado_dev | Usuário: mercado | Senha: mercado123
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: corridas-adminer
    ports:
      - "8888:8080"
    depends_on:
      - postgres
    networks:
      - corridas-net

  # ---------------------------------------------------------------------------
  # Trivy: scanner de vulnerabilidades (roda e sai — profile: scan)
  # Uso: docker compose -f docker/docker-compose.dev.yml --profile scan up trivy
  # ---------------------------------------------------------------------------
  trivy:
    image: aquasec/trivy:latest
    container_name: corridas-trivy
    profiles:
      - scan
    volumes:
      - ..:/project:ro
      - trivy-cache:/root/.cache/trivy
    command: fs /project --severity HIGH,CRITICAL --exit-code 1
    networks:
      - corridas-net

volumes:
  postgres-dev-data:
  mongo-dev-data:
  maven-cache:
  trivy-cache:

networks:
  corridas-net:
    driver: bridge
