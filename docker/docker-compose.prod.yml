# =============================================================================
# Docker Compose — PRODUÇÃO (Equipe 07)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Banco de dados PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: eq07-postgres-prod
    environment:
      POSTGRES_DB: eq07 # Nome real do banco do projeto
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - eq07-prod-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      # Ajustado para checar o banco eq07
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d eq07"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - eq07-net

  # ---------------------------------------------------------------------------
  # Aplicação Spring Boot
  # ---------------------------------------------------------------------------
  app:
    image: ${APP_IMAGE}
    container_name: eq07-app-prod
    pull_policy: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Ajustado para apontar para o banco eq07
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      # MinIO/S3
      MINIO_URL: ${MINIO_URL:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET: ${MINIO_SECRET:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-eq07}
    ports:
      - "127.0.0.1:8107:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - eq07-net

  # ---------------------------------------------------------------------------
  # MinIO: Object Storage S3 compatível
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: eq07-minio-prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - eq07-minio-prod-data:/data
    restart: unless-stopped
    networks:
      - eq07-net

  # Container temporário para criar o bucket automaticamente
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " sleep 5; /usr/bin/mc config host add myminio http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET:-minioadmin}; /usr/bin/mc mb myminio/$${MINIO_BUCKET:-eq07} || true; /usr/bin/mc anonymous set public myminio/$${MINIO_BUCKET:-eq07}; exit 0; "
    networks:
      - eq07-net

volumes:
  eq07-prod-data:
  eq07-minio-prod-data:

networks:
  eq07-net:
    driver: bridge