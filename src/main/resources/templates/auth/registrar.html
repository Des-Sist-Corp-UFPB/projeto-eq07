<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastro — Corrida DSC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/x-icon" th:href="@{/corrida.ico}">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#fff7ed', 100: '#ffedd5',
                            400: '#fb923c', 500: '#f97316',
                            600: '#ea580c', 700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glow-orange { box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); }
        .glow-card   { box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 50px rgba(249,115,22,0.05); }
        input:-webkit-autofill { -webkit-box-shadow: 0 0 0 100px #020617 inset; -webkit-text-fill-color: #e2e8f0; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen overflow-x-hidden font-sans">

    <!-- Background accents: fixed so they never affect document flow -->
    <div class="fixed -top-40 -right-40 w-96 h-96 bg-brand-600 rounded-full filter blur-[128px] opacity-20 animate-pulse pointer-events-none" aria-hidden="true"></div>
    <div class="fixed -bottom-40 -left-40 w-96 h-96 bg-blue-600 rounded-full filter blur-[128px] opacity-20 animate-pulse pointer-events-none" aria-hidden="true"></div>

    <!-- Scroll-safe centering wrapper -->
    <div class="min-h-screen flex items-center justify-center py-12 px-6">
    <div class="w-full max-w-md relative z-10">

        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-orange-400 text-white mb-4 glow-orange transform hover:rotate-6 transition-transform duration-300">
                <!-- Trophy / Start Line SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-9 h-9">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 0 1-.982-3.172M9.497 14.25a7.454 7.454 0 0 0 .981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 0 0 7.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 0 0 2.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 0 1 2.916.52 6.003 6.003 0 0 1-5.395 4.972m0 0a6.726 6.726 0 0 1-2.749 1.35m0 0a6.772 6.772 0 0 1-3.044 0"/>
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-brand-500 bg-clip-text text-transparent">
                CORRIDA <span class="text-brand-500">DSC</span>
            </h1>
            <p class="text-sm text-slate-400 mt-2 font-light">Crie sua conta e entre na corrida</p>
        </div>

        <!-- Card -->
        <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 glow-card">

            <h2 class="text-xl font-semibold text-slate-100 text-center mb-6">Novo Cadastro de Atleta</h2>

            <!-- Business error alert (UsuarioJaExistenteException or generic) -->
            <div th:if="${error}" class="mb-5 bg-red-950/40 border border-red-500/50 text-red-200 p-4 rounded-xl flex items-start space-x-3 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-red-400 mt-0.5 flex-shrink-0">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/>
                </svg>
                <span th:text="${error}"></span>
            </div>

            <!-- Bean-validation field errors (e.g., @NotBlank) -->

            <!-- Registration Form -->
            <form th:action="@{/registrar}" th:object="${usuario}" method="post" class="space-y-4" novalidate>

                <div th:if="${#fields.hasAnyErrors()}" th:object="${usuario}"
                    class="mb-5 bg-amber-950/40 border border-amber-500/50 text-amber-200 p-4 rounded-xl flex items-start space-x-3 text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-amber-400 mt-0.5 flex-shrink-0">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
                    </svg>
                    <span>Preencha todos os campos obrigatórios corretamente.</span>
                </div>

                <!-- Nome Completo -->
                <div class="space-y-1.5">
                    <label for="nome" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Nome Completo</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
                            </svg>
                        </div>
                        <input type="text"
                               id="nome"
                               th:field="*{nome}"
                               th:classappend="${#fields.hasErrors('nome')} ? 'border-red-500' : 'border-slate-800'"
                               class="w-full pl-11 pr-4 py-3 bg-slate-950 border rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none transition-all placeholder:text-slate-600 text-sm"
                               placeholder="Ex: João da Silva"
                               autocomplete="name"
                               autofocus/>
                    </div>
                </div>

                <!-- Login (e-mail / identificador único) -->
                <div class="space-y-1.5">
                    <label for="login" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">E-mail / Login</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/>
                            </svg>
                        </div>
                        <input type="text"
                               id="login"
                               th:field="*{login}"
                               th:classappend="${#fields.hasErrors('login')} ? 'border-red-500' : 'border-slate-800'"
                               class="w-full pl-11 pr-4 py-3 bg-slate-950 border rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none transition-all placeholder:text-slate-600 text-sm"
                               placeholder="seu@email.com"
                               autocomplete="email"/>
                    </div>
                </div>

                <!-- Username (apelido de corrida) -->
                <div class="space-y-1.5">
                    <label for="username" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Apelido de Corrida</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <!-- At-sign icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Zm0 0c0 1.657 1.007 3 2.25 3S21 13.657 21 12a9 9 0 1 0-2.636 6.364M16.5 12V8.25"/>
                            </svg>
                        </div>
                        <input type="text"
                               id="username"
                               th:field="*{username}"
                               th:classappend="${#fields.hasErrors('username')} ? 'border-red-500' : 'border-slate-800'"
                               class="w-full pl-11 pr-4 py-3 bg-slate-950 border rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none transition-all placeholder:text-slate-600 text-sm"
                               placeholder="Ex: velocista_joao"
                               autocomplete="username"/>
                    </div>
                </div>

                <!-- Senha -->
                <div class="space-y-1.5">
                    <label for="senha" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Senha</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
                            </svg>
                        </div>
                        <input type="password"
                               id="senha"
                               th:field="*{senha}"
                               th:classappend="${#fields.hasErrors('senha')} ? 'border-red-500' : 'border-slate-800'"
                               class="w-full pl-11 pr-4 py-3 bg-slate-950 border rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none transition-all placeholder:text-slate-600 text-sm"
                               placeholder="Mínimo 8 caracteres"
                               autocomplete="new-password"/>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit"
                        class="w-full mt-3 bg-gradient-to-r from-brand-600 to-orange-500 hover:from-brand-500 hover:to-orange-400 text-white font-bold py-3 px-4 rounded-xl glow-orange transition-all duration-300 transform active:scale-95 flex items-center justify-center space-x-2 text-sm">
                    <span>Criar Conta e Correr!</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
                    </svg>
                </button>
            </form>

            <!-- Cross-navigation: already have an account? -->
            <div class="mt-6 border-t border-slate-800/80 pt-5 text-center">
                <p class="text-sm text-slate-400">
                    Já possui uma conta?
                    <a th:href="@{/login}"
                       class="text-brand-400 font-semibold hover:text-brand-300 hover:underline underline-offset-4 transition-colors ml-1">
                        Faça o login
                    </a>
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 text-xs text-slate-600">
            &copy; 2026 DSC - UFPB Campus IV. Todos os direitos reservados.
        </div>
    </div>
    </div><!-- /centering wrapper -->
</body>
</html>
