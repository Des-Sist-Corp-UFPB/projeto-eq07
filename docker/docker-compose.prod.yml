# =============================================================================
# Docker Compose — PRODUÇÃO
# =============================================================================
#
# Em produção, a imagem Docker é construída pelo GitHub Actions e publicada
# no GHCR (GitHub Container Registry). Este arquivo usa a imagem pré-construída
# em vez de buildar no servidor — mais seguro, rápido e rastreável.
#
# CONFIGURAÇÃO — arquivo .env na raiz do projeto no servidor:
#
#   DB_USERNAME=corridasdb
#   DB_PASSWORD=<senha-forte-aqui>
#
# PRIMEIRA EXECUÇÃO:
#   docker compose -f docker/docker-compose.prod.yml up -d postgres
#   # Aguardar o banco inicializar (~10s) e depois subir a aplicação:
#   docker compose -f docker/docker-compose.prod.yml up -d app
#
# ATUALIZAÇÕES subsequentes (feitas automaticamente pelo GitHub Actions):
#   docker compose -f docker/docker-compose.prod.yml pull
#   docker compose -f docker/docker-compose.prod.yml up -d --remove-orphans
#
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Banco de dados PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: corridas-postgres-prod
    environment:
      POSTGRES_DB: corridas_dev
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d corridas_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - corridas-net

  # ---------------------------------------------------------------------------
  # Backend — Spring Boot
  #
  # Imagem construída pelo GitHub Actions e publicada no GHCR.
  # O repositório pertence à organização do professor (des-sist-corp-ufpb),
  # por isso a imagem aponta para o GHCR dele — não é necessário alterar.
  # ---------------------------------------------------------------------------
  backend:
    image: ghcr.io/des-sist-corp-ufpb/projeto-eq07-backend:latest
    container_name: corridas-app-prod
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/corridas_dev
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - corridas-net

  # ---------------------------------------------------------------------------
  # Frontend
  #
  # Imagem construída pelo GitHub Actions e publicada no GHCR.
  # ---------------------------------------------------------------------------
  frontend:
    image: ghcr.io/des-sist-corp-ufpb/projeto-eq07-frontend:latest
    container_name: corridas-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - corridas-net

volumes:
  postgres-prod-data:

networks:
  corridas-net:
    driver: bridge