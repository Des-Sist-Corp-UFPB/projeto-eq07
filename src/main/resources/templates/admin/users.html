<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Usuários — Corrida DSC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon" th:href="@{/corrida.ico}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: { 400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c' }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        .glow-orange   { box-shadow: 0 0 22px rgba(249,115,22,0.45); }
        .glow-card     { box-shadow: 0 10px 30px rgba(0,0,0,0.45), 0 0 40px rgba(249,115,22,0.04); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans overflow-x-hidden">

<div th:replace="~{fragments/sidebar :: sidebar('admin')}"></div>

<main class="md:ml-[260px] min-h-screen px-5 md:px-8 py-8">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <div class="flex items-center justify-between border-b border-slate-800 pb-5">
            <div>
                <h1 class="text-3xl font-extrabold text-white">Gerenciamento de Usuários</h1>
                <p class="text-sm text-slate-400 mt-1">Visualize e bloqueie acessos no sistema</p>
            </div>
            <a th:href="@{/admin}" class="text-sm font-semibold text-slate-400 hover:text-white transition-colors">← Voltar</a>
        </div>

        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden glow-card">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800/50 border-b border-slate-700">
                            <th class="py-4 px-5 text-xs font-bold text-slate-400 uppercase tracking-wider">ID</th>
                            <th class="py-4 px-5 text-xs font-bold text-slate-400 uppercase tracking-wider">Usuário</th>
                            <th class="py-4 px-5 text-xs font-bold text-slate-400 uppercase tracking-wider">Papel</th>
                            <th class="py-4 px-5 text-xs font-bold text-slate-400 uppercase tracking-wider text-center">Status</th>
                            <th class="py-4 px-5 text-xs font-bold text-slate-400 uppercase tracking-wider text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/50">
                        <tr th:each="user : ${usersPage.content}" class="hover:bg-slate-800/30 transition-colors">
                            <td class="py-3 px-5">
                                <span class="text-xs text-slate-500 font-mono block" th:text="${user.id}">1</span>
                            </td>
                            <td class="py-3 px-5">
                                <span class="text-sm font-bold text-white block mb-0.5" th:text="${user.nome}">Nome</span>
                                <span class="text-xs text-slate-500 font-mono" th:text="${user.login}">Login</span>
                            </td>
                            <td class="py-3 px-5">
                                <span class="px-2.5 py-1 inline-flex text-xs font-bold rounded-md bg-slate-800 border border-slate-700 text-slate-300" th:text="${user.papel}">PAPEL</span>
                            </td>
                            <td class="py-3 px-5 text-center">
                                <span th:if="${user.bloqueado != null && user.bloqueado}" class="px-3 py-1 inline-flex text-xs font-bold rounded-full bg-red-500/15 text-red-400 border border-red-500/30">Bloqueado</span>
                                <span th:unless="${user.bloqueado != null && user.bloqueado}" class="px-3 py-1 inline-flex text-xs font-bold rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">Ativo</span>
                            </td>
                            <td class="py-3 px-5 text-center">
                                <button th:onclick="'toggleBlock(' + ${user.id} + ')'"
                                        class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all"
                                        th:classappend="${user.bloqueado != null && user.bloqueado} ? 'bg-slate-700 text-white hover:bg-slate-600' : 'bg-red-500/20 text-red-400 border border-red-500/30 hover:bg-red-500 hover:text-white'">
                                    [[${user.bloqueado != null && user.bloqueado} ? 'Desbloquear' : 'Bloquear']]
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(usersPage.content)}">
                            <td colspan="5" class="py-8 text-center text-slate-500">
                                Nenhum usuário encontrado.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</main>

<script>
    function toggleBlock(userId) {
        if(confirm("Deseja alterar o status de bloqueio deste usuário?")) {
            fetch('/api/admin/users/' + userId + '/toggle-block', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' }
            }).then(response => {
                if(response.ok) {
                    location.reload();
                } else {
                    alert("Erro ao alterar o status do usuário.");
                }
            });
        }
    }
</script>
</body>
</html>
