name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, push e deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepara nomes das imagens (lowercase)
        run: |
          BASE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_BACKEND=${BASE}-backend:latest" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=${BASE}-frontend:latest" >> $GITHUB_ENV

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_BACKEND }}

      - name: Build e push da imagem Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy no servidor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_BACKEND: ${{ env.IMAGE_BACKEND }}
          IMAGE_FRONTEND: ${{ env.IMAGE_FRONTEND }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -o SendEnv="GITHUB_TOKEN GITHUB_ACTOR IMAGE_BACKEND IMAGE_FRONTEND DB_URL DB_USERNAME DB_PASSWORD" \
            "${{ secrets.SSH_USERNAME }}@dsc.rodrigor.com" << 'ENDSSH'

            set -e

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || {
              echo "ERRO: login falhou"
              exit 1
            }

            docker pull "$IMAGE_BACKEND"
            docker pull "$IMAGE_FRONTEND"

            docker stop backend frontend || true
            docker rm   backend frontend || true

            docker run -d --name backend --restart unless-stopped -p 8080:8080 \
              -e SPRING_DATASOURCE_URL="$DB_URL" \
              -e SPRING_DATASOURCE_USERNAME="$DB_USERNAME" \
              -e SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD" \
              -e SPRING_DATASOURCE_DRIVER_CLASS_NAME="org.postgresql.Driver" \
              "$IMAGE_BACKEND"

            docker run -d --name frontend --restart unless-stopped -p 80:80 \
              "$IMAGE_FRONTEND"

            docker image prune -f
            echo "=== DEPLOY CONCLUÍDO ==="
