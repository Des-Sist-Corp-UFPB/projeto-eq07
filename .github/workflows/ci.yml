name: Integração contínua

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint e testes
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
      
      - name: Configura JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'

      - name: Instalar dependências e rodar testes
        run: ./mvnw dependency:resolve

      - name: Teste de qualidade de código (lint)
        run: ./mvnw pmd:check   

      - name: Rodar testes
        run: ./mvnw verify

  
