<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gerenciar Participantes</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: {
                            400: '#fb923c', 500: '#f97316',
                            600: '#ea580c', 700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-950 text-slate-100 font-sans">

    <div th:replace="~{fragments/sidebar :: sidebar('minhas-corridas')}"></div>

    <main class="md:ml-[260px] min-h-screen p-5 md:p-8">
        <div class="max-w-5xl mx-auto space-y-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-extrabold text-white">Participantes Inscritos</h1>
                    <p class="text-slate-400 mt-1" th:text="${race.nome}">Corrida Exemplo</p>
                </div>
                <a th:href="@{|/organizacao/${orgId}/corridas|}"
                    class="px-4 py-2 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700">Voltar</a>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr
                            class="bg-slate-950 border-b border-slate-800 text-slate-400 text-sm uppercase tracking-wider">
                            <th class="px-6 py-4 font-bold">Atleta</th>
                            <th class="px-6 py-4 font-bold">Inscrição</th>
                            <th class="px-6 py-4 font-bold text-center">Status / Presença</th>
                            <th class="px-6 py-4 font-bold text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <th:block th:each="inscricao : ${inscricoes.content}">
                            <tr th:replace="~{corrida/fragments/inscricao-tr :: inscricaoRow}"></tr>
                        </th:block>
                        <tr th:if="${inscricoes.empty}">
                            <td colspan="4" class="px-6 py-8 text-center text-slate-500">Nenhum participante inscrito
                                ainda.</td>
                        </tr>
                    </tbody>
                </table>

                <!-- Paginação -->
                <div class="px-6 py-4 border-t border-slate-800 bg-slate-950 flex justify-between items-center"
                    th:if="${inscricoes.totalPages > 1}">
                    <a th:if="${inscricoes.hasPrevious()}"
                        th:href="@{|/organizacao/${orgId}/corridas/${race.id}/participantes?page=${inscricoes.number - 1}|}"
                        class="text-sm font-bold text-brand-400">Anterior</a>
                    <span class="text-sm text-slate-500"
                        th:text="'Página ' + ${inscricoes.number + 1} + ' de ' + ${inscricoes.totalPages}"></span>
                    <a th:if="${inscricoes.hasNext()}"
                        th:href="@{|/organizacao/${orgId}/corridas/${race.id}/participantes?page=${inscricoes.number + 1}|}"
                        class="text-sm font-bold text-brand-400">Próxima</a>
                </div>
            </div>

            <!-- Botão Encerrar Corrida -->
            <div class="flex justify-end pt-4" th:if="${race.status.name() != 'ENCERRADA'}">
                <form th:action="@{|/organizacao/${orgId}/corridas/${race.id}/encerrar|}" method="post"
                    onsubmit="return confirm('ATENÇÃO: Ao encerrar a corrida, todos os atletas com Check-in receberão os KMs correspondentes. Esta ação não pode ser desfeita. Deseja continuar?');">
                    <button type="submit"
                        class="px-6 py-3 bg-brand-600 text-white rounded-xl font-bold hover:bg-brand-500 shadow-lg shadow-brand-500/20">
                        Encerrar Corrida & Distribuir KMs
                    </button>
                </form>
            </div>
            <div class="flex justify-end pt-4" th:if="${race.status.name() == 'ENCERRADA'}">
                <span
                    class="px-6 py-3 bg-emerald-900/50 text-emerald-400 border border-emerald-800 rounded-xl font-bold">
                    Corrida Encerrada (KMs Distribuídos)
                </span>
            </div>
        </div>
    </main>
</body>

</html>
