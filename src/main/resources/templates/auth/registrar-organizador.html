<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Umami Analytics -->
    <script defer src="https://umami.dsc.rodrigor.com/script.js" data-website-id="40e1c211-f336-42a8-b97c-01068e72a148"></script>

    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cadastro Organizador — Corrida DSC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#fff7ed', 100: '#ffedd5',
                            400: '#fb923c', 500: '#f97316',
                            600: '#ea580c', 700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glow-orange { box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); }
        .glow-card   { box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 50px rgba(249,115,22,0.05); }
        input:-webkit-autofill { -webkit-box-shadow: 0 0 0 100px #020617 inset; -webkit-text-fill-color: #e2e8f0; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen overflow-x-hidden font-sans">

    <!-- Background accents -->
    <div class="fixed -top-40 -right-40 w-96 h-96 bg-brand-600 rounded-full filter blur-[128px] opacity-20 pointer-events-none" aria-hidden="true"></div>
    <div class="fixed -bottom-40 -left-40 w-96 h-96 bg-blue-600 rounded-full filter blur-[128px] opacity-20 pointer-events-none" aria-hidden="true"></div>

    <div class="min-h-screen flex items-center justify-center py-12 px-6">
        <div class="w-full max-w-lg relative z-10">

            <!-- Brand Header -->
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-orange-400 text-white mb-3 glow-orange">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-9 h-9">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 0 1-.982-3.172M9.497 14.25a7.454 7.454 0 0 0 .981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 0 0 7.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 0 0 2.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 0 1 2.916.52 6.003 6.003 0 0 1-5.395 4.972m0 0a6.726 6.726 0 0 1-2.749 1.35m0 0a6.772 6.772 0 0 1-3.044 0"/>
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-brand-500 bg-clip-text text-transparent">
                    CORRIDA <span class="text-brand-500">DSC</span>
                </h1>
                <p class="text-xs text-slate-400 mt-1 font-light">Cadastro do Organizador de Eventos</p>
            </div>

            <!-- Wizard Card -->
            <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 glow-card">
                
                <!-- Progress Indicators -->
                <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-800">
                    <div class="flex items-center gap-3">
                        <div id="badge-1" class="w-7 h-7 rounded-full bg-brand-600 text-white flex items-center justify-center font-bold text-xs">1</div>
                        <span id="label-1" class="text-xs font-semibold text-slate-200">Dados Pessoais</span>
                    </div>
                    <div class="flex-1 h-px bg-slate-850 mx-4"></div>
                    <div class="flex items-center gap-3 text-slate-500">
                        <div id="badge-2" class="w-7 h-7 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center font-bold text-xs">2</div>
                        <span id="label-2" class="text-xs font-semibold">Organização</span>
                    </div>
                </div>

                <!-- Errors -->
                <div th:if="${error}" class="mb-5 bg-red-950/40 border border-red-500/50 text-red-200 p-4 rounded-xl flex items-start space-x-3 text-xs">
                    <span th:text="${error}"></span>
                </div>
                
                <div th:if="${erros != null}" class="mb-5 bg-red-950/40 border border-red-500/50 text-red-200 p-4 rounded-xl text-xs">
                    <p class="font-bold mb-2">Corrija os campos abaixo:</p>

                    <ul class="list-disc pl-5 space-y-1">
                        <li th:each="erro : ${erros}">
                            <span th:text="${erro.field}"></span>:
                            <span th:text="${erro.defaultMessage}"></span>
                        </li>
                    </ul>
                </div>

                <form id="organizer-form" th:action="@{/registrar/organizador}" th:object="${organizadorCompleto}" method="post" class="space-y-5" novalidate>
                    
                    <!-- STEP 1: Personal/Council Data -->
                    <div id="step-1-content" class="space-y-4">
                        <!-- Nome Completo -->
                        <div class="space-y-1.5">
                            <label for="step1.nome" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Nome Completo</label>
                            <input type="text" id="step1.nome" th:field="*{step1.nome}" required
                                   class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"
                                   placeholder="Seu nome completo"/>
                        </div>

                        <!-- Login & Password -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label for="step1.login" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">E-mail / Login</label>
                                <input type="email" id="step1.login" th:field="*{step1.login}" required
                                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"
                                       placeholder="seu@email.com"/>
                            </div>
                            <div class="space-y-1.5">
                                <label for="step1.senha" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Senha</label>
                                <input type="password" id="step1.senha" th:field="*{step1.senha}" required
                                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"
                                       placeholder="Mínimo 8 caract."/>
                            </div>
                        </div>

                        <!-- Username & CREF -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label for="step1.username" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Apelido (Username)</label>
                                <input type="text" id="step1.username" th:field="*{step1.username}" required
                                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"
                                       placeholder="Ex: joao_race"/>
                            </div>
                            <div class="space-y-1.5">
                                <label for="step1.cref" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">CREF</label>
                                <input type="text" id="step1.cref" th:field="*{step1.cref}" required
                                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"
                                       placeholder="Ex: 123456-G/SP"/>
                            </div>
                        </div>

                        <!-- CPF & UF Conselho -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label for="step1.cpf" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">CPF</label>
                                <input type="text" id="step1.cpf" th:field="*{step1.cpf}" required
                                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"
                                       placeholder="123.456.789-00"/>
                            </div>
                            <div class="space-y-1.5">
                                <label for="step1.ufConselho" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">UF do Conselho</label>
                                <input type="text" id="step1.ufConselho" th:field="*{step1.ufConselho}" required maxlength="2"
                                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"
                                       placeholder="Ex: SP"/>
                            </div>
                        </div>

                        <!-- Email de contato & Whatsapp -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label for="step1.email" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">E-mail de Contato</label>
                                <input type="email" id="step1.email" th:field="*{step1.email}" required
                                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"
                                       placeholder="contato@organizador.com"/>
                            </div>
                            <div class="space-y-1.5">
                                <label for="step1.whatsapp" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">WhatsApp</label>
                                <input type="text" id="step1.whatsapp" th:field="*{step1.whatsapp}" required
                                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"
                                       placeholder="(11) 99999-9999"/>
                            </div>
                        </div>

                        <button type="button" onclick="nextStep()"
                                class="w-full mt-4 bg-gradient-to-r from-brand-600 to-orange-500 hover:from-brand-500 hover:to-orange-400 text-white font-bold py-3 rounded-xl transition-all duration-300 flex items-center justify-center gap-2">
                            <span>Próximo Passo</span>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
                            </svg>
                        </button>
                    </div>

                    <!-- STEP 2: Organization Data -->
                    <div id="step-2-content" class="space-y-4 hidden">
                        <!-- Nome da Organização -->
                        <div class="space-y-1.5">
                            <label for="step2.name" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Nome da Organização</label>
                            <input type="text" id="step2.name" th:field="*{step2.name}" required
                                   class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"
                                   placeholder="Ex: Associação de Corredores de Rua"/>
                        </div>

                        <!-- Data de Fundação & Logo URL -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label for="step2.foundedAt" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Data de Fundação</label>
                                <input type="date" id="step2.foundedAt" th:field="*{step2.foundedAt}" required
                                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"/>
                            </div>
                            <div class="space-y-1.5">
                                <label for="step2.logoUrl" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">URL do Logo (Opcional)</label>
                                <input type="url" id="step2.logoUrl" th:field="*{step2.logoUrl}"
                                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"
                                       placeholder="http://exemplo.com/logo.png"/>
                            </div>
                        </div>

                        <!-- Descrição da Organização -->
                        <div class="space-y-1.5">
                            <label for="step2.description" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Descrição / Histórico</label>
                            <textarea id="step2.description" th:field="*{step2.description}" rows="3"
                                      class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"
                                      placeholder="Conte um pouco sobre sua organização de eventos de corrida..."></textarea>
                        </div>

                        <!-- Cidade, Estado & Links Sociais -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label for="step2.city" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Cidade Sede</label>
                                <input type="text" id="step2.city" th:field="*{step2.city}"
                                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"
                                       placeholder="Ex: João Pessoa"/>
                            </div>
                            <div class="space-y-1.5">
                                <label for="step2.state" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Estado (UF)</label>
                                <input type="text" id="step2.state" th:field="*{step2.state}" maxlength="2"
                                       class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"
                                       placeholder="Ex: PB"/>
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label for="step2.socialLink" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Site ou Link Social</label>
                            <input type="url" id="step2.socialLink" th:field="*{step2.socialLink}"
                                   class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-slate-200 outline-none text-sm"
                                   placeholder="http://instagram.com/suaorganizacao"/>
                        </div>

                        <div class="flex gap-4 mt-6">
                            <button type="button" onclick="prevStep()"
                                    class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl transition-all border border-slate-700/50">
                                Voltar
                            </button>
                            <button type="submit"
                                    class="w-1/2 bg-gradient-to-r from-brand-600 to-orange-500 hover:from-brand-500 hover:to-orange-400 text-white font-bold py-3 rounded-xl transition-all glow-orange">
                                Concluir Cadastro
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Login option -->
            <div class="text-center mt-6 space-y-3">
                <p class="text-sm text-slate-400">
                    Já é cadastrado?
                    <a th:href="@{/login}" class="text-brand-400 font-semibold hover:text-brand-300 hover:underline">Entre aqui</a>
                </p>
                <p class="text-sm text-slate-500">
                    Quer participar como atleta?
                    <a th:href="@{/registrar}" class="text-orange-400 font-semibold hover:text-orange-300 hover:underline">Cadastre-se como Atleta</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        function nextStep() {
            // Basic Step 1 validation
            const step1Inputs = document.querySelectorAll('#step-1-content input');
            let allValid = true;
            step1Inputs.forEach(input => {
                if (input.hasAttribute('required') && !input.value.trim()) {
                    input.classList.add('border-red-500');
                    allValid = false;
                } else {
                    input.classList.remove('border-red-500');
                }
            });

            if (!allValid) return;

            document.getElementById('step-1-content').classList.add('hidden');
            document.getElementById('step-2-content').classList.remove('hidden');

            // Update header steps UI
            document.getElementById('badge-2').classList.remove('bg-slate-800', 'text-slate-400');
            document.getElementById('badge-2').classList.add('bg-brand-600', 'text-white');
            document.getElementById('label-2').classList.add('text-slate-200');
        }

        function prevStep() {
            document.getElementById('step-2-content').classList.add('hidden');
            document.getElementById('step-1-content').classList.remove('hidden');

            // Reset header steps UI
            document.getElementById('badge-2').classList.remove('bg-brand-600', 'text-white');
            document.getElementById('badge-2').classList.add('bg-slate-800', 'text-slate-400');
            document.getElementById('label-2').classList.remove('text-slate-200');
        }
    </script>
</body>
</html>
